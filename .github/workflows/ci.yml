name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (type-check, tests)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    defaults:
      run:
        working-directory: e-commerce-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e-commerce-backend/package-lock.json
      - run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"
      - run: npm run typecheck
      - run: npm test
        env:
          MONGO_TEST_URI: mongodb://localhost:27017/tehnotrade_test

  frontend:
    name: Frontend (type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-commerce-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e-commerce-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
